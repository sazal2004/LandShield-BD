spring.application.name=landshield

# Local development: in-memory H2 (data resets on every restart)
spring.datasource.url=jdbc:h2:mem:landshielddb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=false

server.port=${PORT:8080}
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Demo officer account (override with ADMIN_PASSWORD env variable)
landshield.officer.username=officer
landshield.officer.password=${ADMIN_PASSWORD:Demo@123}
